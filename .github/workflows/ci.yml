name: Learn Docker and CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Test HTTP service
        run: npm test
      - name: Compile TypeScript
        run: npm run build
      # Store both platform variants locally so we can test them before pushing.
      - name: Enable multi-platform image storage
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up QEMU for ARM emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image for AMD64 and ARM64
        run: docker buildx build --platform linux/amd64,linux/arm64 --load -t my-project:ci .
      - name: Start AMD64 container
        run: docker run -d --platform linux/amd64 --name my-project-ci-amd64 -p 127.0.0.1:3000:3000 my-project:ci
      - name: Check AMD64 container over HTTP
        run: node scripts/check-http.ts http://127.0.0.1:3000
      - name: Start ARM64 container
        run: docker run -d --platform linux/arm64 --name my-project-ci-arm64 -p 127.0.0.1:3001:3000 my-project:ci
      - name: Check ARM64 container over HTTP
        run: node scripts/check-http.ts http://127.0.0.1:3001
      - name: Publish checked image to GHCR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag my-project:ci ghcr.io/denoro55/docker-test:latest
          docker push ghcr.io/denoro55/docker-test:latest
      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs my-project-ci-amd64 || true
          docker logs my-project-ci-arm64 || true
      - name: Remove containers
        if: always()
        run: |
          docker rm -f my-project-ci-amd64 || true
          docker rm -f my-project-ci-arm64 || true
