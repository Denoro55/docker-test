name: Learn Docker and CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Test HTTP service
        run: npm test
      - name: Compile TypeScript
        run: npm run build
      - name: Build Docker image
        run: docker build -t my-project:ci .
      - name: Start container
        run: docker run -d --name my-project-ci -p 127.0.0.1:3000:3000 my-project:ci
      - name: Check container over HTTP
        run: node scripts/check-http.ts
      - name: Show container logs on failure
        if: failure()
        run: docker logs my-project-ci || true
      - name: Remove container
        if: always()
        run: docker rm -f my-project-ci || true
